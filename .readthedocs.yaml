version: 2

# The docs build in the pixi `docs` environment (Sphinx from pixi.lock).
build:
  os: ubuntu-24.04
  tools:
    python: "3.12"
  jobs:
    create_environment:
      - asdf plugin add pixi
      - asdf install pixi 0.77.0
      - asdf global pixi 0.77.0
    install:
      - pixi install --locked -e docs
    build:
      html:
        - pixi run -e docs sphinx-build -W -T -b html docs $READTHEDOCS_OUTPUT/html

sphinx:
  configuration: docs/conf.py
  fail_on_warning: true
