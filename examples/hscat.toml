instrument = "hscat"  # or "ascat"; see docs/index.rst for every platform and resolution
platform = "hy-2b"
resolution = "25km"

# The KNMI satellite/l2b root; in a container, bind it at its real path.
reference_root = "/legacy/project/cersat/public/provider/knmi/satellite/l2b"
start_date = "2025-04-15"
stop_date = "2025-04-16"  # Exclusive; selects reference-granule start days.
sar_missions = ["S1A", "S1C"]
time_tolerance_minutes = 30  # Explicit setting, not a calibrated threshold.
output_dir = "../runs/hscat-001"

# SAR side, the same in every recipe.
# sar_mode: "WV" (default: one Item per imagette), "IW", "EW" or "SM" (one Item per scene).
# WV reads the CDSE daily parquet files when sar_parquet_root is set, else it opens the SAFEs of
# sar_archive_root. IW, EW and SM read the daily parquet files only, so they need
# sar_parquet_root; the archive is then only asked which measurement files exist.
# daily_parquet_files_v2 does not list SM products yet, so an SM run finds none for now.
sar_mode = "WV"
# product_type: "OCN" (default) or "SLC" (Level-1 WV SLC imagettes; WV only, needs
# sar_parquet_root).
product_type = "OCN"
sar_parquet_root = "/scale/project/lops-siam-sentinel1-workbench/data/ifremer/metadata_cdse_sentinel1/daily_parquet_files_v2"
sar_archive_root = "/legacy/project/cersat/public/cache/project/mpc-sentinel1/data/esa"
# Optional: without it (or if it cannot be read) sar_distance_to_coast is null.
distance_to_coast_file = "/legacy/project/cersat/public/cache/public/http/tmp/NASA_tiff_distance_to_coast_converted_v3.nc"
