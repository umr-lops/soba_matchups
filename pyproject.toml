[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "soba_matchups"
dynamic = ["version"]
description = "Sentinel-1 WV matchups with scatterometer, SWOT and altimeter references"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<3", "xarray>=2024.1", "shapely>=2",
                "netCDF4>=1.7,<2", "pyarrow>=15", "s1-geometry>=2026.11.28.1"]

[project.scripts]
soba_matchups = "soba_matchups.cli:main"

[project.optional-dependencies]
dev = ["pytest==9.2.0", "pre-commit==4.7.0", "ruff==0.17.5", "build==1.6.1"]

[project.urls]
Repository = "https://github.com/umr-lops/soba_matchups"

[tool.hatch.version]
path = "src/soba_matchups/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/soba_matchups"]

[tool.hatch.build.targets.sdist]
include = [
    "src",
    "tests",
    "examples",
    "scripts",
    "README.md",
    "architecture_SAR_matchups_design_document.md",
    "LICENSE",
    "pyproject.toml",
    "pixi.lock",
]

[tool.pixi.workspace]
# The environment manager: `pixi install`, then `pixi run test` / `pixi run lint`.
# Runtime libraries come from conda-forge; the package itself is installed editable
# from this checkout, and s1-geometry (not on conda-forge) from PyPI through its
# [project] dependency. The dev tools are the `dev` extra above, so their pins live
# in one place.
channels = ["conda-forge"]
platforms = ["linux-64"]

[tool.pixi.dependencies]
python = "3.12.*"
numpy = ">=1.26,<3"
xarray = ">=2024.1"
shapely = ">=2"
netcdf4 = ">=1.7,<2"
pyarrow = ">=15"

[tool.pixi.pypi-dependencies]
soba_matchups = { path = ".", editable = true }

[tool.pixi.feature.docs.dependencies]
python = "3.12.*"
sphinx = "==9.1.1"

[tool.pixi.feature.docs.tasks]
docs = "sphinx-build -W -b html docs docs/_build/html"

[tool.pixi.feature.slurm.pypi-dependencies]
# turboblast submits the `soba_matchups listing` lines as Slurm job arrays (submitit);
# only needed where turboblaster runs, not in the image.
turboblast = ">=2026.10.7"

[tool.pixi.environments]
# default: runtime + dev tools (tests, lint, build). prod: runtime only, what the Apptainer
# image ships. slurm: runtime + turboblast, to submit job arrays (scripts/slurm/).
# docs: Sphinx alone (the docs do not import the package).
default = { features = ["dev"], solve-group = "default" }
prod = { features = [], solve-group = "default" }
slurm = { features = ["slurm"], solve-group = "default" }
docs = { features = ["docs"], no-default-feature = true }

[tool.pixi.tasks]
test = "python -m pytest"
lint = "pre-commit run --all-files"
build = "python -m build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
extend-exclude = ["assets", "vendor"]

[tool.ruff.lint]
# D1: every public module, class, function and method needs a docstring.
select = ["E", "F", "W", "D1"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D1"]
