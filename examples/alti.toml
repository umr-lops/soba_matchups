instrument = "alti"
platform = "cci"  # every mission found under reference_root
resolution = "l2p"

# The folder that holds data/satellite/altimeter/l2p/<mission>/<year>/<day of year>/ (public v4:
# https://data-cersat.ifremer.fr/data/ocean-waves/cci-seastate/v4/) or the same under l2p-swh (v5).
reference_root = "/path/to/cci-seastate/v4"
start_date = "2020-01-01"
stop_date = "2020-01-02"  # Exclusive; selects the days the altimeter files start on.
sar_missions = ["S1A", "S1B"]
time_tolerance_minutes = 30
sar_archive_root = "/legacy/project/cersat/public/cache/project/mpc-sentinel1/data/esa"
output_dir = "../runs/alti-local-001"
