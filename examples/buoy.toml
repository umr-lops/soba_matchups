instrument = "buoy"
platform = "ndbc-tao-cmems"
resolution = "point"

# The folder that holds ncei/ncei_concat/wind/ (get_ncei_data) and tao/tao_concat/ (get_tao_data).
reference_root = "/scale/project/lops-siam-sentinel1-workbench/data/ifremer/insitu_data"
# The CMEMS in situ dataset folder, with its index_{history,monthly,latest}.txt. Only its buoys
# (moored surface buoys, drifting surface floats) that are neither NDBC stations nor TAO sites.
cmems_insitu_root = "/reference/ref14/public/copernicus/INSITU_GLO_PHYBGCWAV_DISCRETE_MYNRT_013_030/cmems_obs-ins_glo_phybgcwav_mynrt_na_irr"
start_date = "2021-01-04"
stop_date = "2021-01-05"  # Exclusive; selects the days the buoy records fall in.
sar_missions = ["S1A", "S1B"]
time_tolerance_minutes = 30
output_dir = "../runs/buoy-001"

# SAR side, the same in every recipe.
# sar_mode: "WV" (default: one Item per imagette), "IW", "EW" or "SM" (one Item per scene).
# WV reads the CDSE daily parquet files when sar_parquet_root is set, else it opens the SAFEs of
# sar_archive_root. IW, EW and SM read the daily parquet files only, so they need
# sar_parquet_root; the archive is then only asked which measurement files exist.
# daily_parquet_files_v2 does not list SM products yet, so an SM run finds none for now.
sar_mode = "WV"
# product_type: "OCN" (default), "SLC" (Level-1 SLC: WV imagettes, or IW, EW and SM scenes) or
# "GRD" (Level-1 GRD scenes, any resolution; IW, EW and SM only). SLC and GRD need
# sar_parquet_root and the archive layout "mpc".
product_type = "OCN"
sar_parquet_root = "/scale/project/lops-siam-sentinel1-workbench/data/ifremer/metadata_cdse_sentinel1/daily_parquet_files_v2"
sar_archive_root = "/legacy/project/cersat/public/cache/project/mpc-sentinel1/data/esa"
# sar_archive_layout: "mpc" (default, the tree above: sentinel-1x/L2/<mode>/...) or "provider",
# the CERSAT tree of the ESA L2 products, which holds every IW and EW OCN product (IW or EW
# runs only): sar_archive_root = "/legacy/project/cersat/public/provider/esa/satellite/l2".
sar_archive_layout = "mpc"
# Optional: without it (or if it cannot be read) sar_distance_to_coast is null.
distance_to_coast_file = "/legacy/project/cersat/public/cache/public/http/tmp/NASA_tiff_distance_to_coast_converted_v3.nc"
