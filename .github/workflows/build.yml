name: Build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  distributions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
      - run: python -m pip install build==1.6.1
      - run: python -m build
      - run: python -m pip install dist/*.whl
      - name: Import the installed wheel outside the source path
        run: >-
          python -I -c "import soba_matchups; from importlib.metadata import version;
          assert soba_matchups.__version__ == version('soba_matchups')"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error
