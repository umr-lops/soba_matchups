# Pins reflect the verified environment; update with conda env update -f environment.yml.
# Dependabot does not update conda pins; keep shared tool pins aligned with pyproject.toml.
name: soba_matchups
channels:
  - conda-forge
dependencies:
  - python=3.12.15
  - pip=26.2.2
  - pre-commit=4.7.0
  - ruff=0.17.0
  - pytest=9.1.1
  - python-build=1.6.1
  - hatchling=1.32.4
  - numpy=2.4.6
  - xarray=2026.9.0
  - shapely=2.2.0
  - pyproj=3.8.0
  - pyogrio=0.13.0
  - requests=2.34.2
  - netcdf4=1.7.4
