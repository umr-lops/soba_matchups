name: Build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  distributions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: prefix-dev/setup-pixi@9936258fee697aff89b3fed6ca1f80a382ef694e # v0.11.3
        with:
          locked: true
          cache: true
      - run: pixi run build
      # The pixi environment holds the package as an editable install, so the wheel is
      # checked in a bare venv made from pixi's Python, outside the source path.
      - run: pixi run python -m venv "$RUNNER_TEMP/wheel"
      - run: '"$RUNNER_TEMP/wheel/bin/python" -m pip install dist/*.whl'
      - name: Import the installed wheel outside the source path
        working-directory: ${{ runner.temp }}
        run: >-
          "$RUNNER_TEMP/wheel/bin/python" -I -c "import soba_matchups; from importlib.metadata import version;
          assert soba_matchups.__version__ == version('soba_matchups')"
      - run: '"$RUNNER_TEMP/wheel/bin/soba_matchups" --help'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error
